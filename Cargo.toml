[package]
name = "cufsm-rs"
version = "0.4.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Matthew Campbell <mcampbell@mageaustralia.com.au>"]
description = "Independent, dependency-free Rust port of CUFSM: elastic buckling of thin-walled sections by the finite strip method."
readme = "README.md"
homepage = "https://mageengineering.com.au/"
repository = "https://github.com/mageaustralia/cufsm-rs"
keywords = ["finite-strip", "buckling", "cold-formed", "cufsm", "structural"]
categories = ["mathematics", "science"]
exclude = ["tests", "oracle", "examples/dump_matrices.rs"]

[lib]
name = "cufsm"

[features]
# The C-ABI in src/ffi.rs for a standalone wasm module. Off by default so a crate linking
# cufsm-rs does not export its symbols.
ffi = []

[dependencies]

[dev-dependencies]
serde_json = "1"

[profile.test]
opt-level = 3

# The wasm the GUI ships carries no symbol names (about 50 KB less); a native release build
# still reports panic messages and locations.
[profile.release]
strip = true
